<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/PRP_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parish Records Portal — Mfumo wa Usimamizi wa Parokia" />
    <title>PRP — Parish Records Portal</title>
    <script>
      // Applied before React mounts so there's no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('prp_theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
